# Render Blueprint: free API + free static frontend. The database lives on Neon
# (free forever, pgvector built in) because Render's free Postgres expires.
# autoDeployTrigger: checksPass => Render deploys only after GitHub Actions CI is green.
services:
  - type: web
    name: finance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PFAI_DATABASE_URL
        sync: false # Neon connection string
      - key: PFAI_SECRET_KEY
        generateValue: true
      - key: PFAI_CORS_ORIGINS
        sync: false # e.g. https://finance-ui.onrender.com
      - key: PFAI_LLM_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: finance-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://finance-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
